name: Test suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: micro_finance_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/micro_finance_test
          JWT_SECRET: test-secret-key-do-not-use-in-production
          AUTH_COOKIE_MAX_AGE: 3600
          MEMBER_DATA_ENCRYPTION_KEY: $(openssl rand -hex 32)
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: github.event_name != 'pull_request'
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

      - name: Check coverage threshold (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)")
            echo "Line coverage: ${COVERAGE}%"
            if (( $(echo "$COVERAGE < 50" | bc -l) )); then
              echo "Coverage below 50% threshold"
              exit 1
            fi
          else
            echo "No coverage data found"
            exit 1
          fi